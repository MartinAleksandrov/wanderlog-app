name: Build APK

# Merges don't build. A build starts only when you push a version tag on the commit you choose:
#   git tag v1.4.0 && git push origin v1.4.0
on:
  push:
    tags: ['v*']

# Least privilege: the job only reads the code and uploads it to EAS
permissions:
  contents: read

jobs:
  build:
    name: eas build (android, preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # eas-cli logs in with this, no `eas login` needed
      HUSKY: 0 # no git hooks on CI machines
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and branches, so the next step can see main

      # Only merged code becomes an APK: stop if the tag points at a commit that isn't on main
      # (for example a tag made on a feature branch before its PR merged)
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Tag a commit on main instead."
            exit 1
          fi

      # pnpm must exist before setup-node, so setup-node can cache pnpm's store
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # eas-cli evaluates app.config.ts, which needs node_modules
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --no-wait: upload the project and finish; the build itself runs on EAS
      # and reads its env vars from the EAS "preview" environment
      - name: Start EAS build
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
